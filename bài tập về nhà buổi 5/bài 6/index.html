<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131a">
  <title>Kỹ năng của tôi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="skills-card">
    <header class="skills-heading">
      <p class="eyebrow">Năng lực chuyên môn</p>
      <h1>Kỹ năng của tôi</h1>
      <p class="skills-description">Một số công nghệ tôi thường sử dụng trong các dự án.</p>
    </header>

    <section class="skills-list" aria-label="Mức độ thành thạo kỹ năng">
      <div class="skill-bar-wrapper">
        <div class="skill-info">
          <span class="skill-name">HTML</span>
          <span class="skill-percentage">90%</span>
        </div>
        <div
          class="skill-progress-bg"
          role="progressbar"
          aria-label="HTML"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="90"
        >
          <div class="skill-progress-fill" style="--skill-level: 90%"></div>
        </div>
      </div>

      <div class="skill-bar-wrapper">
        <div class="skill-info">
          <span class="skill-name">CSS</span>
          <span class="skill-percentage">85%</span>
        </div>
        <div
          class="skill-progress-bg"
          role="progressbar"
          aria-label="CSS"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="85"
        >
          <div class="skill-progress-fill" style="--skill-level: 85%"></div>
        </div>
      </div>

      <div class="skill-bar-wrapper">
        <div class="skill-info">
          <span class="skill-name">JavaScript</span>
          <span class="skill-percentage">80%</span>
        </div>
        <div
          class="skill-progress-bg"
          role="progressbar"
          aria-label="JavaScript"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="80"
        >
          <div class="skill-progress-fill" style="--skill-level: 80%"></div>
        </div>
      </div>

      <div class="skill-bar-wrapper">
        <div class="skill-info">
          <span class="skill-name">React</span>
          <span class="skill-percentage">75%</span>
        </div>
        <div
          class="skill-progress-bg"
          role="progressbar"
          aria-label="React"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="75"
        >
          <div class="skill-progress-fill" style="--skill-level: 75%"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
